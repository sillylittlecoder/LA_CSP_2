<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Styling with Color Assignment</title>
        <meta charset="UTF-8">
        <style>
            #pgph1{
                background-color: rgb(55, 68, 255); 
                height: 50px;
                width: 100px;
                border: 3px solid orange;
                color:aliceblue;
            }
            #pgph2{
                background-color: green;
                height: 50px;
                width: 100px;
                border: 3px solid yellowgreen;
            }
            #pgph3{
                background-color:blue;
                height: 50px;
                width: 100px;
                border: 3px solid yellow;
                color: red;
            }
            h1{
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Styling With Color</h1>
        <div id="pgph1">
            <p>Complementary</p>
        </div>

        <div id="pgph2">
            <p>Analogous</p>
        </div>

        <div id="pgph3">
            <p>Triadic</p>
        </div>
    </body>
